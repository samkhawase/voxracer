[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voxracer"
version = "0.1.0a1"
description = "Local profiler for voice-agent response time."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Sam Khawase" }]
keywords = ["voice-agents", "latency", "profiling", "observability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]
dependencies = []

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=7.0",
]

[project.urls]
Homepage = "https://github.com/samkhawase/voxracer"
Repository = "https://github.com/samkhawase/voxracer"
Issues = "https://github.com/samkhawase/voxracer/issues"

[project.scripts]
voxracer = "voxracer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/voxracer"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
packages = ["voxracer"]
mypy_path = "src"
